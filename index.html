<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>目标会议截稿追踪 · 软工 & 安全八大顶会</title>
<style>
  :root{--bg:#0b0f1a;--card:#151b2c;--card2:#1b2238;--border:#2a3450;--text:#e6ebf5;--muted:#8b95ad;--se:#4ea1ff;--sec:#ff5c7a;--green:#2ecc71;--yellow:#f1c40f;--orange:#ff8c42;--red:#ff4757;--gray:#6b7280}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 800px at 20% -10%,#1a2a4a 0%,transparent 60%),radial-gradient(1000px 700px at 100% 0%,#2a1a3a 0%,transparent 55%),var(--bg);color:var(--text);min-height:100vh;padding:28px 20px 60px;line-height:1.5}
  .wrap{max-width:1280px;margin:0 auto}
  header{text-align:center;margin-bottom:28px}
  header h1{font-size:30px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,var(--se),var(--sec));-webkit-background-clip:text;background-clip:text;color:transparent}
  header .sub{color:var(--muted);margin-top:6px;font-size:14px}
  header .meta{color:var(--muted);margin-top:8px;font-size:12px}
  header .meta b{color:var(--text)}
  .legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:14px auto 0;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .group{margin-top:30px}
  .group>h2{font-size:20px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:10px}
  .group>h2 .bar{width:6px;height:22px;border-radius:3px}
  .group.se .bar{background:var(--se)}
  .group.sec .bar{background:var(--sec)}
  .group>h2 .tag{font-size:12px;color:var(--muted);font-weight:500}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
  .card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:18px 18px 16px;position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
  .card:hover{transform:translateY(-2px);border-color:#3a4a72}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
  .card.se::before{background:var(--se)}
  .card.sec::before{background:var(--sec)}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .name{font-size:22px;font-weight:800;letter-spacing:.5px}
  .full{font-size:11.5px;color:var(--muted);margin-top:2px}
  .rank{font-size:10.5px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--text);white-space:nowrap;border:1px solid var(--border)}
  .countdown{margin:14px 0 10px;padding:14px 16px;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid var(--border);text-align:center}
  .countdown .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .countdown .big{font-size:34px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
  .countdown .unit{font-size:14px;font-weight:600;color:var(--muted);margin-left:4px}
  .countdown .sub{font-size:12px;color:var(--muted);margin-top:4px}
  .countdown .sub b{color:var(--text)}
  .u7 .big{color:var(--red);animation:pulse 1.2s infinite}
  .u30 .big{color:var(--orange)}
  .u90 .big{color:var(--yellow)}
  .ufar .big{color:var(--green)}
  .uclosed .big{color:var(--gray)}
  .utba .big{color:var(--gray);font-size:22px}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  .info{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;margin-top:8px}
  .info .k{color:var(--muted);white-space:nowrap}
  .info .v{color:var(--text)}
  .info a{color:var(--se);text-decoration:none;word-break:break-all}
  .info a:hover{text-decoration:underline}
  .card.sec .info a{color:var(--sec)}
  .cycles{margin-top:12px;display:flex;flex-direction:column;gap:6px}
  .cycle{font-size:11.5px;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid var(--border);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .cycle .t{color:var(--text);font-weight:600}
  .cycle .d{color:var(--muted)}
  .badge{font-size:10px;padding:2px 7px;border-radius:999px;font-weight:700}
  .badge.open{background:rgba(46,204,113,.15);color:var(--green)}
  .badge.closed{background:rgba(107,114,128,.15);color:var(--gray)}
  .badge.tba{background:rgba(241,196,15,.15);color:var(--yellow)}
  .history{margin-top:12px}
  .history summary{cursor:pointer;font-size:12px;color:var(--muted);user-select:none;padding:4px 0}
  .history summary:hover{color:var(--text)}
  .history table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
  .history th,.history td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--border)}
  .history th{color:var(--muted);font-weight:600}
  .history th:first-child,.history td:first-child{text-align:left}
  .history td.rate{color:var(--green);font-weight:600}
  .history .note{font-size:10px;color:var(--muted);margin-top:4px}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:40px}
  .hint{text-align:center;color:var(--muted);font-size:12px;padding:8px 12px;background:rgba(255,255,255,.03);border-radius:8px;border:1px dashed var(--border);max-width:640px;margin:14px auto 0}
  code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:4px;font-size:90%}
</style>

<script id="app">
function aoeInstant(s){if(!s)return null;return new Date(s+"T23:59:59Z").getTime()+12*3600e3}
function fmtDate(s){if(!s)return"TBA";var d=new Date(s+(s.length<=10?"T00:00:00":""));if(isNaN(d))return s;return d.toLocaleDateString("zh-CN",{year:"numeric",month:"short",day:"numeric"})}
function pickEdition(c){var e=c.editions||[];return e.find(function(x){return (x.cycles||[]).some(function(k){return k.status==="open"})})||e[e.length-1]}
function pickCycle(e){var cs=e.cycles||[];var o=cs.filter(function(c){return c.status==="open"&&c.submission});if(o.length){o.sort(function(a,b){return aoeInstant(a.submission)-aoeInstant(b.submission)});return{c:o[0],k:"open"}}var cl=cs.filter(function(c){return c.status==="closed"&&c.submission});if(cl.length){cl.sort(function(a,b){return aoeInstant(b.submission)-aoeInstant(a.submission)});return{c:cl[0],k:"closed"}}return{c:cs.find(function(c){return c.status==="tba"})||cs[0],k:"tba"}}
function uClass(days,k){if(k==="tba")return"utba";if(k==="closed")return"uclosed";if(days<=7)return"u7";if(days<=30)return"u30";if(days<=90)return"u90";return"ufar"}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function renderCard(conf,gc){
  var ed=pickEdition(conf),p=pickCycle(ed),cyc=p.c,kind=p.k;
  var target=(kind==="open"||kind==="closed")?aoeInstant(cyc.submission):null;
  var now=Date.now(),dp=target?target-now:NaN,past=dp<0;dp=Math.abs(dp);
  var days=Math.floor(dp/864e5),hours=Math.floor((dp%864e5)/36e5),mins=Math.floor((dp%36e5)/6e4),secs=Math.floor((dp%6e4)/1e3);
  var uc=uClass(days,kind);
  var big,label,sub;
  if(kind==="tba"||!cyc||!cyc.submission){big="待公布";label="截稿时间";sub="请关注官网";uc="utba"}
  else if(kind==="closed"){big="已截止";label="截稿时间";sub="已于 "+fmtDate(cyc.submission)+" 截止（"+esc(cyc.track)+"）"}
  else if(past){big="已截止";label="截稿时间";sub=fmtDate(cyc.submission)}
  else{big=days;label="距截稿还剩（"+esc(cyc.track)+"）";sub="截稿 "+fmtDate(cyc.submission)+" · "+hours+"h "+mins+"m "+secs+"s"}
  var h='<div class="card '+gc+'"><div class="card-head"><div><div class="name">'+esc(conf.name)+'</div><div class="full">'+esc(conf.full)+'</div></div><div class="rank">'+esc(conf.rank)+'</div></div>';
  h+='<div class="countdown '+uc+'"><div class="label">'+label+'</div><div class="big">'+big+(typeof big==="number"?'<span class="unit">天</span>':'')+'</div><div class="sub">'+sub+'</div></div>';
  h+='<div class="info"><span class="k">届次</span><span class="v">'+esc(ed.edition)+'</span>';
  h+='<span class="k">会议时间</span><span class="v">'+esc(ed.conf_dates_text)+'</span>';
  h+='<span class="k">会议地点</span><span class="v">'+esc(ed.location)+'</span>';
  h+='<span class="k">官网</span><span class="v"><a href="'+esc(ed.website)+'" target="_blank">'+esc(ed.website)+'</a></span></div>';
  h+='<div class="cycles">';
  (ed.cycles||[]).forEach(function(cy){
    var badge=cy.status==="open"?"open":cy.status==="closed"?"closed":"tba";
    var dtxt=cy.submission?("截稿 "+fmtDate(cy.submission)+(cy.tz?" ("+esc(cy.tz)+")":"")):"截稿 TBA";
    if(cy.abstract)dtxt="摘要 "+fmtDate(cy.abstract)+" · "+dtxt;
    if(cy.notification)dtxt+=" · 通知 "+fmtDate(cy.notification);
    h+='<div class="cycle"><span class="t">'+esc(cy.track)+'</span><span class="d">'+dtxt+'</span><span class="badge '+badge+'">'+(cy.status==="open"?"可投":cy.status==="closed"?"已截止":"待公布")+'</span></div>';
  });
  h+='</div>';
  if(conf.history&&conf.history.length){
    h+='<details class="history"><summary>历年投稿/录用统计</summary><table><tr><th>年份</th><th>投稿</th><th>录用</th><th>录用率</th></tr>';
    conf.history.forEach(function(r){var rate=(r.accepted&&r.submissions)?(r.accepted/r.submissions*100).toFixed(1)+"%":"—";h+='<tr><td>'+r.year+'</td><td>'+(r.submissions||"—")+'</td><td>'+(r.accepted||"—")+'</td><td class="rate">'+rate+'</td></tr>'});
    h+='</table><div class="note">数字为近似参考值，请以官网为准。</div></details>';
  }
  h+='</div>';
  return h;
}

function render(){
  var D=window.CONF_DATA;document.getElementById("lastUpdated").textContent=D.last_updated;
  document.getElementById("now").textContent=new Date().toLocaleString("zh-CN");
  var root=document.getElementById("root");root.innerHTML="";
  D.groups.forEach(function(g){
    var gh='<div class="group '+g.id+'"><h2><span class="bar"></span>'+esc(g.title)+' <span class="tag">'+esc(g.subtitle)+'</span></h2><div class="grid">';
    var cards=g.conferences.map(function(c){return renderCard(c,g.id==="se"?"se":"sec")});
    cards.sort(function(a,b){var da=cardDays(a),db=cardDays(b);return da-db});
    gh+=cards.join("")+'</div></div>';
    root.insertAdjacentHTML("beforeend",gh);
  });
}
function cardDays(html){var m=html.match(/class="big">(\d+)<span/);return m?parseInt(m[1]):99999}
render();setInterval(render,1000);

</script>
</body>
</html>
