<style>
  :root{--bg:#0b0f1a;--card:#151b2c;--card2:#1b2238;--border:#2a3450;--text:#e6ebf5;--muted:#8b95ad;--se:#4ea1ff;--sec:#ff5c7a;--green:#2ecc71;--yellow:#f1c40f;--orange:#ff8c42;--red:#ff4757;--gray:#6b7280}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 800px at 20% -10%,#1a2a4a 0%,transparent 60%),radial-gradient(1000px 700px at 100% 0%,#2a1a3a 0%,transparent 55%),var(--bg);color:var(--text);min-height:100vh;padding:28px 20px 60px;line-height:1.5}
  .wrap{max-width:1280px;margin:0 auto}
  header{text-align:center;margin-bottom:28px}
  header h1{font-size:30px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,var(--se),var(--sec));-webkit-background-clip:text;background-clip:text;color:transparent}
  header .sub{color:var(--muted);margin-top:6px;font-size:14px}
  header .meta{color:var(--muted);margin-top:8px;font-size:12px}
  header .meta b{color:var(--text)}
  .legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:14px auto 0;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .group{margin-top:30px}
  .group>h2{font-size:20px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:10px}
  .group>h2 .bar{width:6px;height:22px;border-radius:3px}
  .group.se .bar{background:var(--se)}
  .group.sec .bar{background:var(--sec)}
  .group>h2 .tag{font-size:12px;color:var(--muted);font-weight:500}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(390px,1fr));gap:16px}
  .card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:18px 18px 16px;position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
  .card:hover{transform:translateY(-2px);border-color:#3a4a72}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
  .card.se::before{background:var(--se)}
  .card.sec::before{background:var(--sec)}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .name{font-size:22px;font-weight:800;letter-spacing:.5px}
  .full{font-size:11.5px;color:var(--muted);margin-top:2px}
  .rank{font-size:10.5px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--text);white-space:nowrap;border:1px solid var(--border)}
  .freq{font-size:11px;color:var(--muted);margin-top:6px}
  .freq b{color:var(--text)}
  .countdown{margin:12px 0 10px;padding:14px 16px;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid var(--border);text-align:center}
  .countdown .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .countdown .big{font-size:30px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
  .countdown .big .u{font-size:14px;font-weight:600;color:var(--muted);margin:0 4px}
  .countdown .sub{font-size:12px;color:var(--muted);margin-top:6px}
  .countdown .sub b{color:var(--text)}
  .u7 .big{color:var(--red);animation:pulse 1.2s infinite}
  .u30 .big{color:var(--orange)}
  .u90 .big{color:var(--yellow)}
  .ufar .big{color:var(--green)}
  .uclosed .big{color:var(--gray)}
  .utba .big{color:var(--gray);font-size:20px}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  .info{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;margin-top:8px}
  .info .k{color:var(--muted);white-space:nowrap}
  .info .v{color:var(--text)}
  .info a{color:var(--se);text-decoration:none;word-break:break-all}
  .info a:hover{text-decoration:underline}
  .card.sec .info a{color:var(--sec)}
  .cycles{margin-top:12px;display:flex;flex-direction:column;gap:6px}
  .cycle{font-size:11.5px;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid var(--border);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .cycle .t{color:var(--text);font-weight:600}
  .cycle .d{color:var(--muted)}
  .badge{font-size:10px;padding:2px 7px;border-radius:999px;font-weight:700}
  .badge.open{background:rgba(46,204,113,.15);color:var(--green)}
  .badge.closed{background:rgba(107,114,128,.15);color:var(--gray)}
  .badge.tba{background:rgba(241,196,15,.15);color:var(--yellow)}
  .history{margin-top:12px}
  .history summary{cursor:pointer;font-size:12px;color:var(--muted);user-select:none;padding:4px 0;list-style:none}
  .history summary::-webkit-details-marker{display:none}
  .history summary::before{content:"▶ ";font-size:9px;color:var(--muted)}
  .history[open] summary::before{content:"▼ "}
  .history summary:hover{color:var(--text)}
  .history table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
  .history th,.history td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--border)}
  .history th{color:var(--muted);font-weight:600}
  .history th:first-child,.history td:first-child{text-align:left}
  .history td.rate{color:var(--green);font-weight:600}
  .history .note{font-size:10px;color:var(--muted);margin-top:4px}
  .pastdl{margin-top:12px;font-size:12px}
  .pastdl h3{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
  .pastdl table{width:100%;border-collapse:collapse}
  .pastdl th,.pastdl td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--border)}
  .pastdl th{color:var(--muted);font-weight:600}
  .pastdl th:first-child,.pastdl td:first-child{text-align:left}
  .pastdl td.pred{color:var(--yellow);font-weight:600}
  .badge.pred{background:rgba(241,196,15,.15);color:var(--yellow)}
  code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:4px;font-size:90%}
</style>

<script id="app">
const TZ_OFFSETS = {"AoE":-12,"UTC":0,"EDT":-4,"EST":-5,"PDT":-7,"PST":-8,"CET":1,"CEST":2,"JST":9,"SGT":8,"CST":8};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function deadlineInstant(cycle){
  if(!cycle||!cycle.submission) return null;
  const t = cycle.time || "23:59";
  const tz = cycle.tz || "AoE";
  const off = TZ_OFFSETS[tz];
  if(off === undefined) return null;
  const asUTC = new Date(cycle.submission + "T" + t + ":00Z");
  return new Date(asUTC.getTime() - off*3600e3);
}
function fmtLocal(dt){
  if(!dt) return "TBA";
  return dt.toLocaleString("zh-CN",{timeZone:"Asia/Shanghai",year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false});
}
function fmtDate(s){if(!s)return"TBA";var d=new Date(s+(s.length<=10?"T00:00:00":""));if(isNaN(d))return s;return d.toLocaleDateString("zh-CN",{timeZone:"Asia/Shanghai",year:"numeric",month:"short",day:"numeric"})}
function pickEdition(c){
  var e=c.editions||[];
  var open=e.find(x=>(x.cycles||[]).some(k=>k.status==="open"));
  if(open) return open;
  var tba=e.find(x=>(x.cycles||[]).some(k=>k.status==="tba"));
  return tba||e[0];
}
function pickPrimary(ed){
  var cs=ed.cycles||[];
  var o=cs.filter(c=>c.status==="open"&&c.submission);
  if(o.length){o.sort((a,b)=>deadlineInstant(a)-deadlineInstant(b));return{c:o[0],k:"open"}}
  var cl=cs.filter(c=>c.status==="closed"&&c.submission);
  if(cl.length){cl.sort((a,b)=>deadlineInstant(b)-deadlineInstant(a));return{c:cl[0],k:"closed"}}
  return{c:cs.find(c=>c.status==="tba")||cs[0],k:"tba"}
}
function nextPredicted(conf){
  var now=Date.now();
  var list=(conf.predicted||[]).filter(p=>p.submission).map(p=>({p,t:deadlineInstant({submission:p.submission,time:"23:59",tz:"AoE"})})).filter(x=>x.t);
  var future=list.filter(x=>x.t.getTime()>now);
  if(future.length){future.sort((a,b)=>a.t-b.t);return future[0]}
  return null;
}
function uClass(days,k){if(k==="tba")return"utba";if(k==="closed")return"uclosed";if(days<=7)return"u7";if(days<=30)return"u30";if(days<=90)return"u90";return"ufar"}

function buildCard(conf,gc){
  var ed=pickEdition(conf),p=pickPrimary(ed),cyc=p.c,kind=p.k;
  var target, label, mode;
  if(kind==="open"){target=deadlineInstant(cyc);label="距截稿还剩（"+cyc.track+"）";mode="dl"}
  else {
    var np=nextPredicted(conf);
    if(np){target=np.t;label="距预测截稿还剩（"+np.p.edition+" "+np.p.track+"）";mode="pred"}
    else {label="截稿时间";mode="tba"}
  }
  var id="cd_"+conf.key;
  var h='<div class="card '+gc+'" data-key="'+conf.key+'">';
  h+='<div class="card-head"><div><div class="name">'+esc(conf.name)+'</div><div class="full">'+esc(conf.full)+'</div></div><div class="rank">'+esc(conf.rank)+'</div></div>';
  h+='<div class="freq">投稿频率：<b>'+esc(conf.frequency||"—")+'</b></div>';
  h+='<div class="countdown" id="'+id+'"></div>';
  h+='<div class="info"><span class="k">届次</span><span class="v">'+esc(ed.edition)+'</span>';
  h+='<span class="k">会议时间</span><span class="v">'+esc(ed.conf_dates_text)+'</span>';
  h+='<span class="k">会议地点</span><span class="v">'+esc(ed.location)+'</span>';
  h+='<span class="k">官网</span><span class="v"><a href="'+esc(ed.website)+'" target="_blank">'+esc(ed.website)+'</a></span></div>';
  h+='<div class="cycles">';
  (ed.cycles||[]).forEach(cy=>{
    var badge=cy.status==="open"?"open":cy.status==="closed"?"closed":"tba";
    var dtxt=cy.submission?("截稿 "+fmtLocal(deadlineInstant(cy))):"截稿 TBA";
    if(cy.abstract) dtxt="摘要 "+fmtLocal(deadlineInstant({...cy,submission:cy.abstract}))+" · "+dtxt;
    if(cy.notification) dtxt+=" · 通知 "+fmtDate(cy.notification);
    h+='<div class="cycle"><span class="t">'+esc(cy.track)+'</span><span class="d">'+dtxt+'</span><span class="badge '+badge+'">'+(cy.status==="open"?"可投":cy.status==="closed"?"已截止":"待公布")+'</span></div>';
  });
  h+='</div>';
  if(conf.pastDeadlines&&conf.pastDeadlines.length){
    h+='<div class="pastdl"><h3>历年截稿（北京时间）</h3><table><tr><th>届次</th><th>批次</th><th>截稿</th></tr>';
    conf.pastDeadlines.forEach(r=>{
      h+='<tr><td>'+esc(r.edition)+'</td><td>'+esc(r.track)+'</td><td>'+fmtLocal(deadlineInstant({submission:r.submission,time:"23:59",tz:"AoE"}))+'</td></tr>';
    });
    (conf.predicted||[]).forEach(r=>{
      h+='<tr><td class="pred">'+esc(r.edition)+'</td><td class="pred">'+esc(r.track)+' · 预测</td><td class="pred">'+fmtLocal(deadlineInstant({submission:r.submission,time:"23:59",tz:"AoE"}))+'</td></tr>';
    });
    h+='</table>';
    var notes=(conf.predicted||[]).map(x=>x.note).filter(Boolean);
    if(notes.length) h+='<div class="note">预测依据：'+esc(notes[0])+'。非官方日期，以官网为准。</div>';
    h+='</div>';
  }
  if(conf.history&&conf.history.length){
    h+='<details class="history"><summary>历年录用统计</summary><table><tr><th>年份</th><th>录用论文数</th></tr>';
    conf.history.forEach(r=>{h+='<tr><td>'+r.year+'</td><td>'+(r.accepted!=null?r.accepted:"—")+'</td></tr>'});
    h+='</table><div class="note">录用数来源：各会议官网 Accepted Papers 页面（主会/Research Track，不含 workshop/poster）。数据截至 2026-06-24。<br>投稿数多数会议不公布，故不列。</div></details>';
  }
  h+='</div>';
  return {html:h, target:target, label:label, mode:mode, kind:kind};
}
const CARDS={};
function renderOnce(){
  var D=window.CONF_DATA;
  document.getElementById("lastUpdated").textContent=D.last_updated;
  var root=document.getElementById("root");root.innerHTML="";
  D.groups.forEach(g=>{
    var gh='<div class="group '+g.id+'"><h2><span class="bar"></span>'+esc(g.title)+' <span class="tag">'+esc(g.subtitle)+'</span></h2><div class="grid" id="grid_'+g.id+'"></div></div>';
    root.insertAdjacentHTML("beforeend",gh);
    var grid=document.getElementById("grid_"+g.id);
    var built=g.conferences.map(c=>buildCard(c,g.id==="se"?"se":"sec"));
    built.sort((a,b)=>sortKey(a)-sortKey(b));
    built.forEach(b=>{var m=b.html.match(/data-key="([^"]+)"/);var key=m[1];CARDS[key]={target:b.target,label:b.label,mode:b.mode,kind:b.kind};grid.insertAdjacentHTML("beforeend",b.html)});
  });
  tick();
}
function sortKey(b){
  if((b.mode==="dl"||b.mode==="pred")&&b.target){var d=(b.target-Date.now())/864e5;return Math.max(0,d)}
  return 1e9;
}
function tick(){
  document.getElementById("now").textContent=new Date().toLocaleString("zh-CN",{timeZone:"Asia/Shanghai"});
  Object.keys(CARDS).forEach(key=>{
    var info=CARDS[key],el=document.getElementById("cd_"+key);
    if(!el)return;
    var target=info.target,label=info.label,mode=info.mode;
    if(mode==="tba"||!target){el.className="countdown utba";el.innerHTML='<div class="label">'+esc(label)+'</div><div class="big">待公布</div>';return}
    var ms=target.getTime()-Date.now(),past=ms<0;ms=Math.abs(ms);
    var d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),mi=Math.floor(ms%36e5/6e4);
    if(past){
      el.className="countdown uclosed";
      el.innerHTML='<div class="label">'+esc(label)+'</div><div class="big">已截止</div><div class="sub">'+fmtLocal(target)+'</div>';return;
    }
    var uc=uClass(d,mode==="pred"?"open":mode);
    var big=d+'<span class="u">天</span>'+h+'<span class="u">时</span>'+mi+'<span class="u">分</span>';
    var sub=(mode==="pred"?"预测截稿：":"截稿：")+fmtLocal(target)+(mode==="pred"?"（非官方）":"");
    el.className="countdown "+uc;
    el.innerHTML='<div class="label">'+esc(label)+'</div><div class="big">'+big+'</div><div class="sub">'+sub+'</div>';
  });
}
renderOnce();
setInterval(tick,1000);
</script>
